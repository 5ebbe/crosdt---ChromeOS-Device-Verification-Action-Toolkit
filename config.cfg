# CONFIGURATION FILE for verify_sn.sh & action_cros.sh
# Please see readme.txt
# 2026-08-08, v.1.0 by Sebastian Bergstroem, https://github.com/5ebbe

# ============================================================================
# MAIN CONFIGURATION (for both action_cros.sh & verify_sn.sh)
# ============================================================================

# Absolute path to the GAM executable you like to use
GAM="/home/user/gam" 

# Define main directory for the scripts - log files will be created herein
MAINDIR="/home/user/crosdt" 

# Specify the owner of the GSheet file you use
FILEOWNER="user@domain.com" 

# Specify the FILE ID you use
FILEID="1DKcC2OHj-E4POZ9MW2YG25kBQsVgD-pekgIOfY6HHkx"

# Only set a value if you have configured GAM with multiple clients/domains. select %domain% is added to the gam command.
DOMAIN="" 

# Input sheet of Serial Numbers that needs to be checked (row 1 header needs to be: serialNumber).
CHECK_SN="CHECK" 

# ============================================================================
# ACTION CONFIGURATION  (for action_cros.sh)
# ============================================================================

# ACTION - What to do with each device read from verified_sn.
#   disable     -> Disable the device (reversible; blocked but stays enrolled)
#   enable      -> Re-enable a previously disabled device (reverses "disable")
#   deprovision -> Deprovision the device (releases license; IRREVERSIBLE; see DEPROV_METHOD)
#   none        -> Do nothing to devices; only move if MOVE_AFTER=true (dry-run friendly)
ACTION="none"

# DEPROV_METHOD - Deprovision reason, used ONLY when ACTION="deprovision".
# Exactly one of the following (Google Admin reason shown in brackets):
#   retiring_device         - [Retiring from fleet] donating/discarding/removing from use
#   different_model_replace - [Different model replacement] upgraded/newer device model
#   same_model_replace      - [Same model replacement] RMA/warranty, same device model
#   upgrade_transfer        - [ChromeOS Flex upgrade transfer] Flex device replaced by a Chromebook within a year
# You can only use one deprovision type for all units in the list.
DEPROV_METHOD="retiring_device"

# MOVE_AFTER - Whether to move devices to another OU after the action.
# The move applies to every device in verified_sn whose current OU differs from
# MOVE_OU, including devices whose action was skipped (already in target state).
#   true  -> move devices to MOVE_OU
#   false -> do not move
MOVE_AFTER="false"

# MOVE_OU - Destination OU for the move (used only when MOVE_AFTER="true").
MOVE_OU="/Ω_devices/Ω_deprovisioned"

# ============================================================================
# The following variables are for logging and are set when a script is executed
# to ensure consistency in all logging and file operations.
#
# !!! Please note that this depends on that the date and time of the machine
# you run the script on needs to be correct if you like to trust the timestamps
# used in the logs and the report made.
# ============================================================================
START=`date +%s` # Records start time for the script. Used to calculate total run time.
MONTH=$(date +"%b_%Y") # Sets current month and year.
DATETIME=$(date "+%Y-%m-%d %H:%M:%S %Z (%:z)") # Sets complete date & time.
TIME=$(date +"%H.%M.%S.%Z") # Sets time.
DATE=$(date "--iso-8601") # Sets date.
YEAR=$(date +"%Y") # Sets year.

# ** ATTENTION! The section below must be at the end of the config file
if [[ -z "${DOMAIN}" ]]; then
    # DOMAIN variable is not set or is empty
    GAMCMD="${GAM}"
else
    # DOMAIN variable has a value
    GAMCMD="${GAM}"" select ""${DOMAIN}"
fi

LOGDIR="$MAINDIR"/log # Define log directory. Must be set after logging variables to work.
mkdir -p "$LOGDIR"; wait # Create log directory if non-existent.
